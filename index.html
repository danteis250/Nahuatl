<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Náhuatl">
<title>Huasteca Náhuatl</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --success: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; 
    padding: calc(env(safe-area-inset-top, 20px) + 12px) 16px calc(env(safe-area-inset-bottom, 20px) + 12px) 16px; 
    background: var(--bg); 
    color: var(--text); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }
  
  .nav { display: flex; width: 100%; max-width: 420px; gap: 8px; margin-bottom: 16px; }
  .tab-btn { flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .view { width: 100%; max-width: 420px; display: none; flex-direction: column; gap: 14px; }
  .view.active { display: flex; }

  .progress-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  .bar-bg { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s; }

  .study-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; min-height: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
  .study-word { font-size: 2rem; font-weight: 700; margin-bottom: 6px; }
  .study-def { font-size: 1.15rem; color: var(--muted); margin-top: 4px; }
  .study-pos { font-size: 0.8rem; font-style: italic; color: #64748b; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; background: #334155; color: var(--accent); margin-bottom: 10px; font-weight: 600; }

  .choice-btn { width: 100%; background: var(--card); border: 1.5px solid var(--border); color: var(--text); padding: 14px; border-radius: 12px; margin-bottom: 8px; font-size: 0.95rem; text-align: left; cursor: pointer; transition: 0.15s; }
  .choice-btn.correct { background: var(--success); border-color: var(--success); color: white; }
  .choice-btn.wrong { background: var(--danger); border-color: var(--danger); color: white; }

  .action-btn { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; width: 100%; cursor: pointer; margin-top: 8px; }

  .search-box { width: 100%; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.95rem; outline: none; margin-bottom: 8px; }
  .list-container { max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .list-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .item-word { font-weight: 700; font-size: 1rem; color: var(--text); }
  .item-def { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>

  <div class="nav">
    <button class="tab-btn active" onclick="switchTab('learn')">Aprender</button>
    <button class="tab-btn" onclick="switchTab('quiz')">Quiz</button>
    <button class="tab-btn" onclick="switchTab('library')">Diccionario</button>
  </div>

  <div class="view active" id="learn-view">
    <div class="progress-card">
      <div class="progress-label">
        <span>Progreso de dominio</span>
        <span id="mastery-stat">0 / 639</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="mastery-bar"></div></div>
    </div>

    <div class="study-card" id="learn-card">
      <div class="badge" id="learn-badge">ESTUDIA EL TÉRMINO</div>
      <div class="study-word" id="learn-word">Cargando...</div>
      <div class="study-def" id="learn-def">...</div>
      <div class="study-pos" id="learn-pos"></div>
    </div>

    <div id="learn-actions"></div>
  </div>

  <div class="view" id="quiz-view">
    <div class="study-card">
      <div class="badge">TRADUCE LA PALABRA</div>
      <div class="study-word" id="quiz-word">...</div>
      <div class="study-pos" id="quiz-pos"></div>
    </div>
    <div id="quiz-choices"></div>
  </div>

  <div class="view" id="library-view">
    <input type="search" class="search-box" id="search-input" placeholder="Buscar palabra o traducción..." oninput="filterLibrary()">
    <div class="list-container" id="library-list"></div>
  </div>

<script>
  let rawData = [];
  let mastery = JSON.parse(localStorage.getItem('nahuatl_mastery') || '{}');

  function saveMastery() {
    localStorage.setItem('nahuatl_mastery', JSON.stringify(mastery));
    updateMasteryUI();
  }

  function getScore(w) { return mastery[w] || 0; }
  function addScore(w) { mastery[w] = Math.min((mastery[w] || 0) + 1, 2); saveMastery(); }
  function resetScore(w) { mastery[w] = 0; saveMastery(); }

  function updateMasteryUI() {
    let masteredCount = Object.values(mastery).filter(v => v === 2).length;
    document.getElementById('mastery-stat').innerText = masteredCount + ' / ' + (rawData.length || 639);
    let pct = (masteredCount / (rawData.length || 1)) * 100;
    document.getElementById('mastery-bar').style.width = pct + '%';
  }

  let activeBatch = [];
  let currentLearnItem = null;

  function prepareBatch() {
    let unmastered = rawData.filter(i => getScore(i.word) < 2);
    if (!unmastered.length) {
      alert("¡Felicidades! Has dominado todo el vocabulario.");
      mastery = {};
      saveMastery();
      unmastered = rawData;
    }
    activeBatch = unmastered.sort(() => Math.random() - 0.5).slice(0, 7);
    nextLearnStep();
  }

  function nextLearnStep() {
    updateMasteryUI();
    let remaining = activeBatch.filter(i => getScore(i.word) < 2);
    if (!remaining.length) {
      alert("¡Ronda completada! Cargando siguientes palabras...");
      prepareBatch();
      return;
    }

    currentLearnItem = remaining[Math.floor(Math.random() * remaining.length)];
    let score = getScore(currentLearnItem.word);

    let badge = document.getElementById('learn-badge');
    let wordEl = document.getElementById('learn-word');
    let defEl = document.getElementById('learn-def');
    let posEl = document.getElementById('learn-pos');
    let actBox = document.getElementById('learn-actions');
    actBox.innerHTML = '';

    wordEl.innerText = currentLearnItem.word;
    posEl.innerText = currentLearnItem.pos || '';

    if (score === 0) {
      badge.innerText = "ESTUDIA EL TÉRMINO";
      badge.style.color = "#38bdf8";
      defEl.style.display = 'block';
      defEl.innerText = currentLearnItem.def;

      let btn = document.createElement('button');
      btn.className = 'action-btn';
      btn.innerText = "¡Entendido! Probar";
      btn.onclick = () => { addScore(currentLearnItem.word); nextLearnStep(); };
      actBox.appendChild(btn);
    } else {
      badge.innerText = "COMPRUEBA RETENCIÓN";
      badge.style.color = "#fbbf24";
      defEl.style.display = 'none';

      let options = [currentLearnItem];
      while (options.length < 4) {
        let r = rawData[Math.floor(Math.random() * rawData.length)];
        if (!options.includes(r)) options.push(r);
      }
      options.sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        let b = document.createElement('button');
        b.className = 'choice-btn';
        b.innerText = opt.def;
        b.onclick = () => {
          if (opt === currentLearnItem) {
            b.classList.add('correct');
            addScore(currentLearnItem.word);
            setTimeout(nextLearnStep, 450);
          } else {
            b.classList.add('wrong');
            resetScore(currentLearnItem.word);
            setTimeout(nextLearnStep, 750);
          }
        };
        actBox.appendChild(b);
      });
    }
  }

  function nextQuickQuiz() {
    let item = rawData[Math.floor(Math.random() * rawData.length)];
    document.getElementById('quiz-word').innerText = item.word;
    document.getElementById('quiz-pos').innerText = item.pos || '';

    let opts = [item];
    while (opts.length < 4) {
      let r = rawData[Math.floor(Math.random() * rawData.length)];
      if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);

    let box = document.getElementById('quiz-choices');
    box.innerHTML = '';
    opts.forEach(o => {
      let b = document.createElement('button');
      b.className = 'choice-btn';
      b.innerText = o.def;
      b.onclick = () => {
        if (o === item) {
          b.classList.add('correct');
          setTimeout(nextQuickQuiz, 450);
        } else {
          b.classList.add('wrong');
        }
      };
      box.appendChild(b);
    });
  }

  function renderLibrary(items) {
    let container = document.getElementById('library-list');
    container.innerHTML = '';
    items.slice(0, 100).forEach(item => {
      let sc = getScore(item.word);
      let div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = '<div><div class="item-word">' + item.word + '</div><div class="item-def">' + item.def + (item.pos ? ' <i>(' + item.pos + ')</i>' : '') + '</div></div>' +
                      '<span style="font-size:0.75rem; color:' + (sc === 2 ? 'var(--success)' : (sc === 1 ? '#fbbf24' : '#64748b')) + '; font-weight:600;">' + (sc === 2 ? 'Dominado' : (sc === 1 ? 'Aprendiendo' : 'Nuevo')) + '</span>';
      container.appendChild(div);
    });
  }

  function filterLibrary() {
    let q = document.getElementById('search-input').value.toLowerCase().trim();
    if (!q) { renderLibrary(rawData); return; }
    let matches = rawData.filter(i => (i.word && i.word.toLowerCase().includes(q)) || (i.def && i.def.toLowerCase().includes(q)));
    renderLibrary(matches);
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (tab === 'learn' && i === 0) || (tab === 'quiz' && i === 1) || (tab === 'library' && i === 2)));
    document.getElementById('learn-view').classList.toggle('active', tab === 'learn');
    document.getElementById('quiz-view').classList.toggle('active', tab === 'quiz');
    document.getElementById('library-view').classList.toggle('active', tab === 'library');

    if (tab === 'quiz' && !document.getElementById('quiz-choices').children.length) nextQuickQuiz();
    if (tab === 'library') filterLibrary();
  }

  fetch('nahuatl.json')
    .then(r => r.json())
    .then(data => {
      rawData = data;
      updateMasteryUI();
      prepareBatch();
      renderLibrary(rawData);
    })
    .catch(err => alert("Error al cargar nahuatl.json: " + err));
</script>
</body>
</html>
